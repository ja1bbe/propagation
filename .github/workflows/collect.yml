name: 伝搬データの収集（抜き取り）

on:
  schedule:
    - cron: "12 * * * *"       # 毎時12分に起動（UTC）。8分間受け取る
  workflow_dispatch:           # Actions の画面から手動でも実行できる

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 部品を入れる
        run: python -m pip install paho-mqtt
      - name: 8分間受け取って集計する
        run: python sample_collect.py --minutes 8
      - name: 保存する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
